name = "pets-vote-monitor"
main = "workers/mgtv-monitor/index.js"
compatibility_date = "2026-06-15"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[vars]
MGTV_API_BASE = "https://hb-mangott.api.mgtv.com"
MGTV_HOT_VOTE_API = "https://vote.api.mgtv.com/chengfeng/query_vote_list"
MGTV_HOT_VOTE_SOURCE = "share_cf_zj_2026_cz"
STAGE_COLLECTION_ENABLED = "true"
HOT_VOTE_COLLECTION_ENABLED = "true"
WEIBO_STAGE_COLLECTION_ENABLED = "false"
MGTV_APP_ID = "1"
MGTV_PLATFORM = "iphone"
MGTV_TARGET_NAME = "曾沛慈"
RETENTION_DAYS = "30"
CORS_ORIGIN = "*"

[[d1_databases]]
binding = "DB"
database_name = "pets_vote_monitor"
database_id = "32d8e6bb-641c-4254-b642-e9b4b49a4834"
migrations_dir = "workers/mgtv-monitor/migrations"
